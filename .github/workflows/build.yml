name: Firmware build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pico_w, pico2_w]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Check out Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          submodules: recursive
          path: pico-sdk

      - name: Configure
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -S src_fw -B build/${{ matrix.board }} -G Ninja \
            -DPICO_BOARD=${{ matrix.board }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/${{ matrix.board }} --parallel

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-to-usb-keyboard-${{ matrix.board }}
          path: build/${{ matrix.board }}/picow_ble_usb_hid_bridge.uf2
          if-no-files-found: error
