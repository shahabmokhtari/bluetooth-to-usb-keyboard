<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pico Keyboard Pairing</title>
<style>
:root {
  --ink: #172019;
  --paper: #e8e3d2;
  --signal: #ff5b35;
  --line: #8e9585;
  --ok: #237a4b;
}
* { box-sizing: border-box }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--ink);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  display: grid;
  place-items: center;
  padding: 24px;
}
main {
  width: min(760px, 100%);
  background: var(--paper);
  border: 1px solid #fff7;
  box-shadow: 14px 14px 0 #080b09;
  padding: clamp(24px, 6vw, 58px);
  position: relative;
  overflow: hidden;
}
main:before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 31px, #1720190b 32px);
  pointer-events: none;
}
.eyebrow {
  font: 700 12px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: #495247;
}
h1 {
  font-size: clamp(42px, 9vw, 82px);
  line-height: .83;
  letter-spacing: -.06em;
  margin: 24px 0 34px;
  max-width: 560px;
}
.panel {
  position: relative;
  border-top: 3px solid var(--ink);
  border-bottom: 1px solid var(--line);
  padding: 22px 0;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 20px;
  align-items: center;
}
.label {
  font: 700 11px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #5d665a;
}
#status { font-size: 25px; margin-top: 5px }
.lamp { width: 18px; height: 18px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 7px #ff5b3526 }
.lamp.ready { background: var(--ok); box-shadow: 0 0 0 7px #237a4b26 }
#passkeyBox { display: none; margin: 30px 0; padding: 24px; border: 2px solid var(--ink); background: #fff9 }
#passkeyBox.show { display: block; animation: arrive .25s ease-out }
#passkey {
  font: 700 clamp(42px, 10vw, 76px)/1 ui-monospace, SFMono-Regular, Consolas, monospace;
  letter-spacing: .12em;
  margin-top: 8px;
}
.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px }
button {
  appearance: none;
  border: 2px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font: 700 13px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
  text-transform: uppercase;
  letter-spacing: .08em;
  padding: 15px 18px;
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--ink);
  transition: .12s;
}
button:hover:not(:disabled) { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink) }
button.primary { background: var(--signal) }
button:disabled { opacity: .38; cursor: not-allowed; box-shadow: none }
.note { font: 14px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; margin: 25px 0 0; color: #50584e }
#error { color: #a32b18; min-height: 1.5em }
@keyframes arrive { from { transform: translateY(8px); opacity: 0 } }
@media (max-width: 520px) {
  main { box-shadow: 8px 8px 0 #080b09 }
  .panel { grid-template-columns: 1fr auto }
  #passkey { letter-spacing: .05em }
}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Pico W / BLE → USB</div>
  <h1>Keyboard<br>Pairing Desk</h1>
  <section class="panel">
    <div><div class="label">Bridge state</div><div id="status">Not connected to UI</div></div>
    <span id="lamp" class="lamp"></span>
  </section>
  <section id="passkeyBox">
    <div class="label">Type this on the Bluetooth keyboard, then press Enter</div>
    <div id="passkey">000000</div>
  </section>
  <div class="actions">
    <button id="connect" class="primary">Connect to Pico</button>
    <button id="pair" disabled>Pair new keyboard</button>
  </div>
  <p id="error" class="note"></p>
  <p class="note">Offline control page · Chrome or Edge required · The wired keyboard remains available when this page is closed.</p>
</main>
<script>
const VID = 0xcafe, PID = 0x4007;

const labels = {
  starting: "Starting Bluetooth",
  scanning: "Scanning for a keyboard",
  connecting: "Connecting",
  pairing: "Waiting for pairing",
  discovering: "Reading keyboard layout",
  ready: "Keyboard ready",
  disconnected: "Keyboard disconnected",
  forgetting: "Forgetting current keyboard",
};

let port, reader;
const $ = id => document.getElementById(id);

function render(message) {
  if (message.type !== "status") {
    return;
  }

  $("status").textContent = labels[message.state] || message.state;
  $("lamp").classList.toggle("ready", message.state === "ready");
  $("pair").disabled = false;

  if (message.passkey) {
    $("passkey").textContent = message.passkey;
    $("passkeyBox").classList.add("show");
  } else {
    $("passkeyBox").classList.remove("show");
  }
}

async function send(command) {
  if (!port?.writable) {
    return;
  }

  const writer = port.writable.getWriter();
  try {
    await writer.write(new TextEncoder().encode(command + "\n"));
  } finally {
    writer.releaseLock();
  }
}

async function readLoop(activePort) {
  const decoder = new TextDecoder();
  let pending = "";

  while (activePort.readable && port === activePort) {
    reader = activePort.readable.getReader();
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) {
          break;
        }

        pending += decoder.decode(value, { stream: true });
        const lines = pending.split("\n");
        pending = lines.pop();
        for (const line of lines) {
          try {
            render(JSON.parse(line.trim()));
          } catch {
            // Ignore malformed or partial lines.
          }
        }
      }
    } catch (error) {
      if (port === activePort) {
        $("error").textContent = "Serial connection lost. Reconnect after the Pico finishes refreshing USB.";
      }
    } finally {
      reader.releaseLock();
      reader = null;
    }
  }
}

$("connect").onclick = async () => {
  $("error").textContent = "";
  if (!("serial" in navigator)) {
    $("error").textContent = "Web Serial is unavailable. Open this file in Google Chrome or Microsoft Edge.";
    return;
  }

  try {
    port = await navigator.serial.requestPort({ filters: [{ usbVendorId: VID, usbProductId: PID }] });
    await port.open({ baudRate: 115200 });
    $("connect").disabled = true;
    $("connect").textContent = "UI connected";
    readLoop(port);
    await send("STATUS");
  } catch (error) {
    $("error").textContent = error.message || "Could not open the Pico serial port.";
  }
};

$("pair").onclick = async () => {
  if (!confirm("Forget the current keyboard and start pairing a new one?")) {
    return;
  }

  $("pair").disabled = true;
  $("error").textContent = "";
  await send("PAIR_NEW");
};

navigator.serial?.addEventListener("disconnect", () => {
  $("connect").disabled = false;
  $("connect").textContent = "Reconnect to Pico";
  $("pair").disabled = true;
});
</script>
</body>
</html>
